<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Симплекс-метод · разбор примера</title>
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #fffdf8;
      --ink: #1c1916;
      --muted: #6b645b;
      --line: #d9d0c3;
      --accent: #1f4d63;
      --accent-soft: #e4eef2;
      --pivot: #b45309;
      --pivot-soft: #f3e0c8;
      --enter: #155e75;
      --leave: #9a3412;
      --ok: #3f6212;
      --ok-soft: #e8efd8;
      --bad: #9f1239;
      --shadow: 0 0 0 1px var(--line);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "Iosevka", "Cambria", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 56px 1fr 44px;
      height: 100%;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    header .brand { font-weight: 650; letter-spacing: 0.01em; }
    header .brand span { color: var(--muted); font-weight: 500; }
    .phase {
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .progress {
      flex: 1;
      height: 4px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0;
    }
    .counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 52px; text-align: right; }

    .nav-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      height: 32px;
      min-width: 32px;
      padding: 0 10px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    .stage {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 0;
    }

    .toc {
      border-right: 1px solid var(--line);
      padding: 14px 10px;
      overflow: auto;
      background: #f7f3eb;
    }
    .toc h2 {
      margin: 0 8px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 650;
    }
    .toc button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .toc button.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .toc button .n {
      display: inline-block;
      width: 18px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    main {
      overflow: auto;
      padding: 28px 36px 40px;
    }
    .slide { max-width: 1140px; }
    .slide.wide { max-width: 860px; }
    .slide.wide h1 { font-size: 22px; }
    .slide.wide .lead { margin-bottom: 12px; font-size: 15px; }
    .stage.wide-slide { grid-template-columns: 200px 1fr; }
    .tbl-cap {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 0 0 8px;
    }
    .rb-chain {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      max-width: 820px;
    }
    .why { font-size: 15px; line-height: 1.5; }
    .why p { margin: 8px 0; }
    .why .eq { font-size: 17px; }
    .why .k { font-weight: 650; }
    .why .old2 {
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.7;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 8px 0;
    }
    .mk { padding: 0 3px; border-radius: 3px; font-weight: 650; }
    .mk.p { background: #e8c48a; }
    .mk.n { background: #f6e6d4; }
    .mk.t { background: #dbeaf0; }
    .mk.q { background: #e8efd8; }
    .rb-ref {
      margin: 0 0 12px;
      padding: 10px 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .rb-ref table.sx th, .rb-ref table.sx td {
      padding: 4px 7px;
      font-size: 14px;
      min-width: 36px;
    }
    .pocket {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 10px 0 0;
    }
    .pocket summary {
      cursor: pointer;
      padding: 8px 12px;
      list-style: none;
      display: block;
    }
    .pocket summary::-webkit-details-marker { display: none; }
    .pocket-title::before {
      content: "▸ ";
      color: var(--accent);
    }
    .pocket[open] .pocket-title::before { content: "▾ "; }
    .pocket-title { font-weight: 650; }
    .pocket-body { padding: 4px 12px 12px; border-top: 1px solid var(--line); }
    .rb-block {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .rb-block.calc {
      border-left: 4px solid var(--accent);
      background: #f7f3eb;
    }
    .rb-block.fresh {
      box-shadow: 0 0 0 2px var(--accent);
    }
    .rb-block h3 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 650;
    }
    .rb-down {
      text-align: center;
      color: var(--accent);
      font-size: 20px;
      line-height: 1;
      padding: 6px 0;
      font-weight: 650;
    }
    .rb-calc-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: start;
    }
    .rect.big b {
      min-width: 44px;
      height: 38px;
      font-size: 18px;
    }
    .rect-key { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
    .rect-block .eq { font-size: 16px; line-height: 1.65; overflow-wrap: break-word; }
    td.src, th.src { background: var(--accent-soft) !important; outline: 2px solid var(--enter); outline-offset: -2px; }
    .rb-chain table.sx th, .rb-chain table.sx td {
      padding: 5px 8px;
      font-size: 15px;
      min-width: 40px;
    }
    @media (max-width: 800px) {
      .rb-calc-grid { grid-template-columns: 1fr; }
    }
    .aux-split {
      display: grid;
      grid-template-columns: 1fr minmax(360px, 460px);
      gap: 18px;
      align-items: start;
      margin-top: 16px;
    }
    .schema {
      width: 100%;
      height: auto;
      display: block;
      margin-top: 8px;
      background: var(--paper);
    }
    .flow {
      display: grid;
      grid-template-columns: 1fr 28px 1fr 28px 1fr 28px 1fr;
      gap: 8px;
      align-items: stretch;
      margin: 4px 0 8px;
    }
    .flow .box {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .flow .box b { display: block; margin-bottom: 4px; }
    .flow .arr {
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 22px;
      font-weight: 650;
    }
    @media (max-width: 1100px) {
      .flow { grid-template-columns: 1fr; }
      .flow .arr { transform: rotate(90deg); padding: 0; height: 20px; }
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
    .chip {
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
      min-width: 72px;
    }
    .chip .k { display: block; font-size: 12px; color: var(--muted); }
    .chip .v { display: block; font-size: 20px; font-weight: 650; margin-top: 2px; }
    .chip.pick { background: var(--pivot-soft); border-color: var(--pivot); }
    .chip.skip { opacity: 0.55; }
    .race { margin-top: 8px; }
    .race-row { display: grid; grid-template-columns: 70px 1fr 70px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }
    .race-bar { height: 10px; background: #ece6db; border-radius: 99px; overflow: hidden; }
    .race-bar > i { display: block; height: 100%; background: var(--accent); }
    .race-row.win .race-bar > i { background: var(--pivot); }
    .race-row.win { font-weight: 650; }
    .swap {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
    }
    .swap .box { background: #f7f3eb; border-radius: 8px; padding: 10px 12px; }
    .swap .arrow { font-size: 22px; color: var(--accent); }
    .hl { background: var(--pivot-soft); padding: 0 3px; border-radius: 3px; }
    .dim { color: #a39a90; }
    .mini-wrap { overflow: auto; }
    table.sx.tiny th, table.sx.tiny td { padding: 5px 7px; font-size: 14px; min-width: 36px; }
    .rect {
      display: inline-grid;
      grid-template-columns: auto auto auto;
      gap: 6px 10px;
      align-items: center;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 16px;
      margin: 10px 0;
    }
    .rect b {
      display: grid;
      place-items: center;
      min-width: 36px;
      height: 32px;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .rect b.p { background: #e8c48a; font-weight: 700; }
    .rect b.n { background: #f6e6d4; }
    .rect b.t { background: #dbeaf0; }
    .rect b.q { background: var(--ok-soft); font-weight: 700; }
    td.fresh, th.fresh { background: var(--ok-soft) !important; }
    td.now { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
    .rebuild-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--bg);
      padding: 4px 0 10px;
      margin: 0 0 8px;
    }
    .rebuild-nav .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
    .rebuild-nav .hint { font-size: 13px; color: var(--muted); }
    @media (max-width: 1200px) {
      .aux-split { grid-template-columns: 1fr; }
    }
    .slide h1 {
      font-size: 28px;
      font-weight: 650;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .lead { color: var(--muted); font-size: 16px; margin: 0 0 22px; line-height: 1.45; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .eq {
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.7;
    }
    .eq .sys { margin: 6px 0 0 8px; }
    .note { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-right: 6px;
    }
    .tag.warn { background: var(--pivot-soft); color: var(--pivot); }
    .tag.ok { background: var(--ok-soft); color: var(--ok); }

    .steps { margin: 0; padding: 0; list-style: none; }
    .steps li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 15px;
      line-height: 1.45;
    }
    .steps .num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 650;
    }

    table.sx {
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 16px;
      background: var(--paper);
    }
    table.sx th, table.sx td {
      border: 1px solid var(--line);
      padding: 7px 10px;
      text-align: center;
      min-width: 52px;
    }
    table.sx th { background: #f3eee4; font-weight: 650; font-size: 14px; }
    table.sx td.rowh { background: #f3eee4; font-weight: 650; }
    table.sx td.clickable { cursor: pointer; }
    table.sx td.clickable:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
    table.sx .col-enter { background: #dbeaf0; }
    table.sx .row-leave { background: #f6e6d4; }
    table.sx .pivot { background: #e8c48a; font-weight: 750; color: var(--leave); }
    table.sx .gone { color: #b0a89c; text-decoration: line-through; }
    table.sx .obj { background: #eef3e3; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

    footer {
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--paper);
      color: var(--muted);
      font-size: 12px;
    }
    kbd {
      font-family: inherit;
      font-size: 11px;
      border: 1px solid var(--line);
      background: #f7f3eb;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .geom { width: 100%; height: 340px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
    .slide.wide.geom-slide { max-width: 1180px; }
    .slide.wide.geom-slide h1 { font-size: 24px; }
    .geom-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
      gap: 18px;
      align-items: start;
    }
    .geom-fig {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .geom-fig .geom {
      height: auto;
      display: block;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .geom-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      padding: 2px 14px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .geom-legend .sw { border: 1px solid rgba(28,25,22,0.12); }
    .geom-story { display: flex; flex-direction: column; gap: 10px; }
    .geom-story .card { padding: 14px 16px; }
    .geom-story .card h3 { margin-bottom: 8px; }
    .geom-story .card p { margin: 0 0 8px; }
    .geom-story .card p:last-child { margin-bottom: 0; }
    .geom-story .card.start { border-left: 3px solid #1c1916; }
    .geom-story .card.best { border-left: 3px solid var(--accent); background: var(--accent-soft); }
    .geom-story .eq { font-size: 16px; margin: 6px 0; }
    @media (max-width: 1100px) {
      .geom-layout { grid-template-columns: 1fr; }
    }
    .slide.wide.hw-slide { max-width: 1180px; }
    .slide.wide.hw-slide h1 { font-size: 24px; }
    .hw-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .hw-layout .card p { margin: 0 0 8px; }
    .hw-layout .card p:last-child { margin-bottom: 0; }
    .hw-layout .card + .card { margin-top: 10px; }
    .ban {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 0;
    }
    .ban span {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 99px;
      background: #f8e8ea;
      color: var(--bad);
      border: 1px solid #e8c5cc;
    }
    .codebox {
      font-family: Consolas, "Segoe UI Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
      background: #f7f3eb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 8px 0 0;
    }
    @media (max-width: 1100px) {
      .hw-layout { grid-template-columns: 1fr; }
    }
    .callout {
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
      font-size: 15px;
      line-height: 1.45;
    }
    .callout.warn { border-color: var(--pivot); background: var(--pivot-soft); }
    .callout.ok { border-color: var(--ok); background: var(--ok-soft); }
    .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; vertical-align: middle; font-size: 0.85em; }
    .frac span { padding: 0 3px; }
    .frac .num { border-bottom: 1px solid currentColor; }
    .bigstat { font-size: 26px; font-weight: 650; margin: 8px 0 4px; }
    .muted { color: var(--muted); }

    .count-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .count-row:last-child { border-bottom: 0; }
    .pm {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .pm button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 6px;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }
    .pm button:hover { border-color: var(--accent); color: var(--accent); }
    .pm .val { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-size: 20px; }
    .meter {
      height: 10px;
      background: #ece6db;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 10px;
    }
    .meter > i { display: block; height: 100%; width: 0; background: var(--bad); }
    .meter.ok > i { background: var(--ok); }
    .live-eq { font-size: 22px; margin: 8px 0 0; }
    .links { list-style: none; margin: 0; padding: 0; }
    .links li { margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
    .links a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }
    .links a:hover { border-bottom-color: var(--accent); }
    .problem {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 22px 26px 20px;
    }
    .problem .given {
      font-size: 16px;
      line-height: 1.55;
      margin: 0 0 16px;
    }
    .problem .label {
      display: block;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .problem .sys-block {
      margin: 4px 0 0 12px;
    }
    .cond {
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .cond:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
    .nv {
      background: var(--pivot-soft);
      color: var(--leave);
      padding: 0 4px;
      border-radius: 3px;
      font-weight: 650;
    }
    .nv.art {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .imat {
      display: inline-grid;
      grid-template-columns: repeat(3, 28px);
      gap: 0;
      font-variant-numeric: tabular-nums;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 16px;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .imat span {
      display: grid;
      place-items: center;
      height: 28px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .imat span:nth-child(3n) { border-right: 0; }
    .imat span:nth-child(n+7) { border-bottom: 0; }
    .imat .one { background: var(--ok-soft); font-weight: 700; }
    .imat .bad { background: #f3d6dc; font-weight: 700; }
    .seg {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }
    .seg button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .seg button.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .verdict {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .verdict:last-child { border-bottom: 0; }

      const takeFromStart = k > 0 ? (steps[k - 1].src || []) : ["c,0"];
      let html = tableBlock(
        k > 0 && steps[k - 1].src ? "Основная таблица 0. Голубым те числа, которые берём ниже" : "Основная таблица 0",
        startVals,
        startSpec,
        { src: new Set(takeFromStart) },
        false,
        k === 0
      );
      for (let i = 0; i < k; i++) {
        const s = steps[i];
        const last = i === k - 1;
        html += "<div class='rb-down'>↓</div>";
        html += calcBlock(s, last);
        html += "<div class='rb-down'>↓</div>";
        const fresh = Object.keys(s.set || {}).filter((key) => !(s.now || []).includes(key));
        html += tableBlock(
          s.cap,
          merged(i),
          Object.assign({ pr: PR, pc: PC, cross: i < 3 }, s),
          { now: new Set(s.now || []), fresh: new Set(fresh) },
          false,
          last
        );
      }
      chainEl.innerHTML = html;
      cnt.textContent = (k + 1) + " / " + total;
      if (prevB) prevB.disabled = k === 0;
      if (nextB) nextB.disabled = k === steps.length;
      const last = chainEl.querySelector(".rb-block.fresh");
      if (last && k > 0) last.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    if (prevB) prevB.onclick = () => { if (k > 0) { k--; paint(); } };
    if (nextB) nextB.onclick = () => { if (k < steps.length) { k++; paint(); } };
    paint();
  }

  function bindCreamWidget() {
    let x1 = 0, x3 = 0;
    const elX1 = document.getElementById("cream-x1");
    const elX3 = document.getElementById("cream-x3");
    const elEq = document.getElementById("cream-eq");
    const elMsg = document.getElementById("cream-msg");
    const meter = document.getElementById("cream-meter");
    if (!elX1 || !elX3 || !elEq || !elMsg || !meter) return;

    function paint() {
      const v = 3 * x1 + 2 * x3;
      const ok = v >= 12;
      elX1.textContent = String(x1);
      elX3.textContent = String(x3);
      elEq.textContent = "3·" + x1 + " + 2·" + x3 + " = " + v;
      elMsg.textContent = ok
        ? "Хватает. Договор закрыт, можно везти в кофейню."
        : "Пока мало. Нужно ещё " + (12 - v) + " бан. Кофейня витрину не откроет.";
      meter.classList.toggle("ok", ok);
      meter.querySelector("i").style.width = Math.min(100, (v / 12) * 100) + "%";
    }

    document.querySelectorAll("[data-cream]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const d = +btn.getAttribute("data-cream");
        const which = btn.getAttribute("data-var");
        if (which === "x1") x1 = Math.max(0, Math.min(8, x1 + d));
        if (which === "x3") x3 = Math.max(0, Math.min(8, x3 + d));
        paint();
      });
    });
    paint();
  }

  function drawGeom() {
    const svg = document.getElementById("geom");
    if (!svg) return;
    const X0 = 72, Y0 = 428, S = 56;
    const X = (x1) => X0 + x1 * S;
    const Y = (x3) => Y0 - x3 * S;
    function line(x1, y1, x2, y2, extra) {
      return '<line x1="' + X(x1) + '" y1="' + Y(y1) + '" x2="' + X(x2) + '" y2="' + Y(y2) + '" ' + extra + " />";
    }
    function pill(px, py, w, h, label, ink, fill, stroke) {
      return '<g>' +
        '<rect x="' + px + '" y="' + py + '" width="' + w + '" height="' + h + '" rx="7" fill="' + (fill || "#fffdf8") + '" stroke="' + (stroke || "#d9d0c3") + '"/>' +
        '<text x="' + (px + 10) + '" y="' + (py + 16) + '" font-size="13" font-weight="650" fill="' + (ink || "#1c1916") + '">' + label + "</text>" +
        "</g>";
    }

    let g = '<defs>';
    g += '<marker id="geom-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">';
    g += '<path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#1f4d63"/>';
    g += "</marker></defs>";
    g += '<g font-family="Segoe UI, Cambria, Georgia, serif" fill="#1c1916">';

    for (let n = 0; n <= 6; n++) {
      g += '<line x1="' + X(0) + '" y1="' + Y(n) + '" x2="' + X(6.35) + '" y2="' + Y(n) + '" stroke="#efe8dc"/>';
      g += '<line x1="' + X(n) + '" y1="' + Y(0) + '" x2="' + X(n) + '" y2="' + Y(6.35) + '" stroke="#efe8dc"/>';
    }

    g += line(-0.05, 5.05, 5.15, -0.15, 'stroke="#9a3412" stroke-width="1.7" stroke-dasharray="6 4"');
    g += line(4.2, -0.3, -0.15, 6.225, 'stroke="#b45309" stroke-width="1.7" stroke-dasharray="6 4"');
    g += line(6.2, -0.2, -0.15, 6.2, 'stroke="#155e75" stroke-width="1.7" stroke-dasharray="6 4"');

    const poly = [[5, 0], [6, 0], [0, 6], [2, 3]].map(function (p) { return X(p[0]) + "," + Y(p[1]); }).join(" ");
    g += '<polygon points="' + poly + '" fill="#c5d6c0" fill-opacity="0.88" stroke="#3f5c3a" stroke-width="1.6"/>';

    const dx = -2, dy = 3, len = Math.sqrt(13);
    const ux = dx / len, uy = dy / len;
    g += '<line x1="' + X(2 + ux * 0.28) + '" y1="' + Y(3 + uy * 0.28) + '" x2="' + X(0 - ux * 0.34) + '" y2="' + Y(6 - uy * 0.34) + '" stroke="#1f4d63" stroke-width="3.2" marker-end="url(#geom-arr)"/>';

    g += line(0, 0, 6.55, 0, 'stroke="#1c1916" stroke-width="1.5"');
    g += line(0, 0, 0, 6.55, 'stroke="#1c1916" stroke-width="1.5"');
    g += '<text x="' + (X(6.55) + 10) + '" y="' + (Y0 + 4) + '" font-size="15" font-weight="650">торты x₁</text>';
    g += '<text x="' + (X0 - 6) + '" y="' + (Y(6.55) - 10) + '" font-size="15" font-weight="650">пироги x₃</text>';
    for (let n = 0; n <= 6; n++) {
      g += '<text x="' + X(n) + '" y="' + (Y0 + 20) + '" font-size="12" fill="#6b645b" text-anchor="middle">' + n + "</text>";
      if (n > 0) g += '<text x="' + (X0 - 10) + '" y="' + (Y(n) + 4) + '" font-size="12" fill="#6b645b" text-anchor="end">' + n + "</text>";
    }

    g += '<text x="' + X(3.7) + '" y="' + (Y(0.22) + 4) + '" font-size="13" font-weight="650" fill="#b45309">крем = 12</text>';
    g += '<text x="' + X(2.55) + '" y="' + (Y(3.75) - 4) + '" font-size="13" font-weight="650" fill="#155e75">противень = 6</text>';
    g += '<text x="' + X(3.25) + '" y="' + (Y(1.2) + 14) + '" font-size="13" font-weight="650" fill="#9a3412">x₂ = 0</text>';

    [[5, 0], [6, 0]].forEach(function (p) {
      g += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="4.5" fill="#b0a89c"/>';
    });
    g += '<circle cx="' + X(2) + '" cy="' + Y(3) + '" r="7" fill="#1c1916"/>';
    g += '<circle cx="' + X(0) + '" cy="' + Y(6) + '" r="7" fill="#1f4d63"/>';
    g += pill(X(2) + 16, Y(3) + 10, 108, 24, "старт · W = 1");
    g += pill(X(0) + 20, Y(6) - 30, 146, 24, "оптимум · W = −5", "#1f4d63", "#e4eef2", "#1f4d63");
    g += "</g>";
    svg.innerHTML = g;
  }

  let i = 0;
  const main = document.getElementById("main");
  const toc = document.getElementById("toc");
  const phase = document.getElementById("phase");
  const counter = document.getElementById("counter");
  const bar = document.getElementById("bar");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  toc.innerHTML = "<h2>Ход практики</h2>" + slides.map((s, k) =>
    "<button type='button' data-i='" + k + "'><span class='n'>" + (k + 1) + "</span>" + s.toc + "</button>"
  ).join("");

  function render() {
    const s = slides[i];
    phase.textContent = s.phase;
    counter.textContent = (i + 1) + " / " + slides.length;
    bar.style.width = ((i + 1) / slides.length * 100) + "%";
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    toc.querySelectorAll("button").forEach((b, k) => b.classList.toggle("active", k === i));
    document.querySelector(".stage").classList.toggle("wide-slide", !!s.wide);

    main.innerHTML = "<div class='slide" + (s.wide ? " wide" : "") + (s.id === "geom" ? " geom-slide" : "") + (s.id === "hw" ? " hw-slide" : "") + "'><h1>" + s.title + "</h1><p class='lead'>" + s.lead + "</p>" +
      (s.html || "") +
      (s.tableau ? tableauHTML(s.tableau) : "") +
      (s.htmlAfter || "") +
      "</div>";
    if (s.onEnter) s.onEnter();
  }

  prev.onclick = () => { if (i > 0) { i--; render(); } };
  next.onclick = () => { if (i < slides.length - 1) { i++; render(); } };
  toc.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    i = +b.getAttribute("data-i");
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("details, summary") && (e.key === " " || e.key === "Enter")) return;
    const rbNext = document.getElementById("rb-next");
    const rbPrev = document.getElementById("rb-prev");
    if (rbNext && (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ")) {
      e.preventDefault();
      if (!rbNext.disabled) { rbNext.click(); return; }
      if (i < slides.length - 1) { i++; render(); }
      return;
    }
    if (rbPrev && (e.key === "ArrowLeft" || e.key === "PageUp")) {
      e.preventDefault();
      if (!rbPrev.disabled) { rbPrev.click(); return; }
      if (i > 0) { i--; render(); }
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault();
      if (i < slides.length - 1) { i++; render(); }
    }
    if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      if (i > 0) { i--; render(); }
    }
    if (e.key === "Home") { i = 0; render(); }
    if (e.key === "End") { i = slides.length - 1; render(); }
  });

  render();
})();
</script>
